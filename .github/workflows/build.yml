name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build frontend
        run: npm ci && npm run build

      - name: Build application
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hexviwer-windows-x64
          path: src-tauri/target/release/hexviwer.exe

  linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Frontend is platform-independent; build it on the x64 host so the
      # slow QEMU container only has to compile Rust.
      - name: Build frontend
        run: npm ci && npm run build

      # Build natively inside an arm64 Ubuntu 24.04 container via QEMU.
      # The GitHub workspace is bind-mounted, so the binary ends up in
      # src-tauri/target/release on the host as well.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build application (arm64)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            ubuntu:24.04 bash -c '
            set -euxo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential pkg-config curl ca-certificates file \
              libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
              libayatana-appindicator3-dev librsvg2-dev
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            cargo build --release --manifest-path src-tauri/Cargo.toml
          '
          mkdir -p artifacts
          cp src-tauri/target/release/hexviwer artifacts/hexviwer-linux-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hexviwer-linux-arm64
          path: artifacts/hexviwer-linux-arm64

  release:
    name: Publish GitHub Release
    needs: [windows-x64, linux-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename windows binary
        run: cp artifacts/hexviwer-windows-x64/hexviwer.exe artifacts/hexviwer-windows-x64.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/hexviwer-windows-x64.exe
            artifacts/hexviwer-linux-arm64/hexviwer-linux-arm64

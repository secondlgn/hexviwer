[package]
name = "hexviwer"
version = "0.1.0"
description = "A cross-platform binary viewer"
authors = ["you"]
edition = "2021"

[lib]
name = "hexviwer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
memchr = "2"
base64 = "0.22"
thiserror = "1"
parking_lot = "0.12"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
